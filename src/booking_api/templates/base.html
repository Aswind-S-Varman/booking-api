<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booking{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    header { background: #fff; border-bottom: 1px solid #e3e5e8; padding: 0.75rem 1.5rem;
             display: flex; gap: 1.5rem; align-items: center; }
    header a { color: #1a1a1a; text-decoration: none; font-weight: 500; }
    header .spacer { margin-left: auto; color: #6b7280; font-size: 0.9rem; }
    main { max-width: 760px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: #fff; border: 1px solid #e3e5e8; border-radius: 8px;
            padding: 1.25rem; margin-bottom: 1rem; }
    .error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b;
             padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
    button { background: #1f4e79; color: #fff; border: 0; border-radius: 6px;
             padding: 0.5rem 0.9rem; cursor: pointer; font-size: 0.9rem; }
    button:disabled { background: #d1d5db; cursor: not-allowed; }
    button.link { background: none; color: #1f4e79; padding: 0; text-decoration: underline; }
    input { width: 100%; padding: 0.55rem; border: 1px solid #cbd5e1;
            border-radius: 6px; margin-bottom: 0.9rem; font-size: 1rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: #4b5563; }
    .slot { display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 0; border-bottom: 1px solid #f1f2f4; }
    .taken { color: #9ca3af; font-size: 0.85rem; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <a href="/ui/resources">Resources</a>
    <a href="/ui/bookings">My bookings</a>
    <span class="spacer">{{ user.email }} ({{ user.role }})</span>
    <form method="post" action="/ui/logout"><button class="link">Log out</button></form>
  </header>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
